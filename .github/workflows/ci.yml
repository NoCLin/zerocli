name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -v

      - name: Smoke-test example commands
        run: |
          python -m examples.files --help
          python -m examples.files summarize README.md --max-lines 1
          python -m examples.files repo
          python -m examples.files repo --help
          python -m examples.files repo find examples --pattern '*.py'
          python -m examples.files repo git status --short
